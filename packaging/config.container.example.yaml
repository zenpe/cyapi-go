runtime_directory: "/data"
server:
  listen: "0.0.0.0:8080"
  trusted_proxies: []
  cors_allowed_origins: []
database:
  driver: "sqlite"
  dsn: "/data/cyapi.db"
sources:
  directory: "/data/sources"
  repo: "guoyue2010/lxmusic-"
source_recommendation:
  enabled: false
  automatic:
    enabled: false
    full_interval: 168h
    watch_interval: 3h
    min_samples: 3
    min_positive_samples: 2
    evidence_max_age: 6h
mail:
  sender_email: ""
