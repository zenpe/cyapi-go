name: Go CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to test when called by the release workflow
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  select-checks:
    name: Select CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          CHECK_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == branch && -z "$CHECK_REF" ]]; then
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
                echo 'Release tag owns CI checks for this commit.'
                echo 'run=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done < <(git tag --points-at HEAD)
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"

  test:
    needs: select-checks
    if: ${{ needs.select-checks.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cyapi_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cyapi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cyapi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CYAPI_TEST_POSTGRES_DSN: postgres://cyapi_test:test-only-password@127.0.0.1:5432/cyapi_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./... -count=1 -timeout=10m
      - name: Pure Go Linux builds
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/cyapi-linux-amd64 ./cmd/cyapi
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/cyapi-linux-arm64 ./cmd/cyapi

  nas-install:
    needs: select-checks
    if: ${{ needs.select-checks.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build current and v0.0.2 executables
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=v0.0.4" -o dist/cyapi-current ./cmd/cyapi
          CGO_ENABLED=0 go test -c -o dist/cyapi-ops-test ./cmd/cyapi
          legacy_commit=be9900dab018e6ec7d618e2d09d1e71d6cebe16b
          git fetch --no-tags origin "$legacy_commit"
          git worktree add --detach /tmp/cyapi-legacy-source "$legacy_commit"
          cd /tmp/cyapi-legacy-source
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=v0.0.2" -o "$GITHUB_WORKSPACE/dist/cyapi-legacy" ./cmd/cyapi
      - name: Exercise real systemd installation and upgrade
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y acl
          sudo python3 scripts/test_nas_install.py --binary "$PWD/dist/cyapi-current" --legacy "$PWD/dist/cyapi-legacy"
      - name: Exercise automatic GitHub upgrade with controlled release fixture
        run: sudo env NAS_UPGRADE_TEST_BINARY="$PWD/dist/cyapi-current" NAS_UPGRADE_TEST_LEGACY="$PWD/dist/cyapi-legacy" "$PWD/dist/cyapi-ops-test" -test.run '^TestAutomaticUpgradeSystemd$' -test.v -test.timeout=4m
