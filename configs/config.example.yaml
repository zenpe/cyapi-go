# Literal KEY=VALUE file beside this config; process environment takes precedence.
secrets_file: "secrets.env"
runtime_directory: "data"
maintenance:
  enabled: false # install generates enabled: true; existing deployments opt in explicitly
  sync_interval: "6h"
  backup_interval: "24h"
  backup_directory: "backups"
  backup_keep: 7

server:
  listen: "127.0.0.1:8080"
  trusted_proxies: []
  cors_allowed_origins: []
  shutdown_grace: "30s"
database:
  driver: "sqlite"
  dsn: "data/cyapi.db"
  dsn_env: ""
  busy_timeout: "5s"
auth:
  secret_env: "CYAPI_AUTH_SECRET"
  token_max_age: "720h"
cache:
  max_bytes: 16777216
  max_entries: 2000
  max_item_bytes: 1048576
sources:
  repo: "guoyue2010/lxmusic-"
  max_zip_bytes: 536870912
  max_file_bytes: 67108864
  max_total_bytes: 2147483648
  max_files: 10000
  reserve_bytes: 1073741824
  timeout: "10m"
  directory: "data/sources"
  github_token_env: "GITHUB_TOKEN"
  allow_empty: false
mail:
  app_name: "CyreneMusic"
  sender_name: "CyreneMusic"
  provider: "brevo"
  api_key_env: "BREVO_API_KEY"
  sender_email: ""
providers:
  max_concurrent: 4
  request_timeout: "8s"
  user_requests_per_minute: 120
  ip_requests_per_minute: 300
  netease_cookie_env: "NETEASE_COOKIE"
  qq_cookie_env: "QQ_COOKIE"
  kugou_cookie_env: "KUGOU_COOKIE"
